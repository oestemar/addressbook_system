<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="base :: head('住所一覧')">
</head>

<body class="bg-gray-100">

<header th:replace="header :: header">
</header>

<main class="container mx-auto pt-20">

    <h2 class="text-2xl font-bold mb-4">
        削除
    </h2>

    <form th:action="@{/delete/{id}(id=${address.id})}"
          method="post"
          class="space-y-4">
        <p class="border p-4">ID:
            <span th:text="${address.id}"></span>
        </p>
        <p class="border p-4">氏名:
            <span th:text="${address.name}"></span>
        </p>
        <p class="border p-4">メール:
            <span th:text="${address.email}"></span>
        </p>
        <p class="border p-4">電話:
            <span th:text="${address.phone}"></span>
        </p>
        <p class="border p-4">郵便番号:
            <span th:text="${address.postalCode}"></span>
        </p>
        <p class="border p-4">住所:
            <span th:text="${address.address}"></span>
        </p>

    <button
            type="submit"
            class="bg-green-600 text-white px-6 py-2 rounded">

        削除

    </button>
    </form>
</main>

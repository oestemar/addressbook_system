<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="base :: head('住所一覧')">
</head>

<body class="bg-gray-100">

<header th:replace="header :: header">
</header>

<main class="container mx-auto pt-20">

    <h2 class="text-xl font-bold mb-4">新規登録</h2>

    <form th:action="@{/register}"
          method="post"
          class="space-y-4">

        <input
                type="text"
                name="name"
                placeholder="氏名"
                class="border rounded px-3 py-2 w-full">

        <input
                type="text"
                name="email"
                placeholder="メール"
                class="border rounded px-3 py-2 w-full">

        <input
                type="text"
                name="phone"
                placeholder="電話"
                class="border rounded px-3 py-2 w-full">

        <input
                type="text"
                name="postalCode"
                placeholder="郵便番号"
                class="border rounded px-3 py-2 w-full">

        <input
                type="text"
                name="address"
                placeholder="住所"
                class="border rounded px-3 py-2 w-full">

        <button
                type="submit"
                class="bg-green-600 text-white px-6 py-2 rounded">

            登録

        </button>

    </form>

</main>
